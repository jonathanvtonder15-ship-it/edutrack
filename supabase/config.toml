project_id = "edutrack"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 8
[auth.email]
# This switch enables the email/password provider. Global signups stay disabled above.
enable_signup = true
[edge_runtime]
enabled = false
[analytics]
enabled = false
